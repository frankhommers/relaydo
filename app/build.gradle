//file:noinspection DependencyNotationArgument
import groovy.json.JsonBuilder
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'img-optimizer'
    id 'com.yanzhenjie.andserver'
    //AspectJX: https://github.com/wurensen/gradle_plugin_android_aspectjx
    //id "io.github.wurensen.android-aspectjx" version "3.3.2"
}

/**
 * ================================
 * XAOP / AspectJ Toggle
 * Only release Enable
 * debug / test Disable all (avoid Windows File Lock）
 * ================================
 */
ext.enableXaop = gradle.startParameter.taskNames.any { name ->
    name.toLowerCase().contains("release")
}
println "[XAOP] enable = ${enableXaop}, tasks = ${gradle.startParameter.taskNames}"

def keyProps = new Properties()
def keyPropsFile = rootProject.file('keystore/keystore.properties')
if (keyPropsFile.exists()) {
    keyProps.load(new FileInputStream(keyPropsFile))
}

//Remember to set up when you're packing.trueEnable
if (isNeedPackage.toBoolean() && isUseBooster.toBoolean()) {
    apply plugin: 'com.didiglobal.booster'
}

// Ban Java Compiler displays obsolete API Warning
gradle.projectsEvaluated {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:-removal"
    }
}

android {
    buildToolsVersion build_versions.build_tools
    compileSdkVersion build_versions.target_sdk

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    //Date compiled
    def buildDate = new Date().format("yyMMdd", TimeZone.getTimeZone("GMT+08"))
    //Compile Time
    def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("GMT+08"))
    //Git of Commit ID
    def gitCommitId = getGitCommitId()

    defaultConfig {
        applicationId "tools.franks.relaydo"
        // Package only supported locales, including resources from dependencies.
        resConfigs 'en', 'nl'
        minSdkVersion build_versions.min_sdk
        targetSdkVersion build_versions.target_sdk
        // Release tooling and tests may override the build number without editing files: -PbuildNumber=59
        versionCode(project.hasProperty('buildNumber') ? Integer.parseInt(project.property('buildNumber').toString()) : build_versions.version_code)
        versionName = "${build_versions.version_name}.${buildDate}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "GIT_COMMIT_ID", "\"${gitCommitId}\""
        // Updater test fixture (local emulator tests only). Empty unless -PupdaterFixtureOrigin / -PupdaterFixtureCa
        // are passed; scripts/release.py refuses to package a build in which either is set.
        def fixtureOrigin = project.findProperty('updaterFixtureOrigin') ?: ''
        def fixtureCa = project.findProperty('updaterFixtureCa') ? file(project.findProperty('updaterFixtureCa')).text.readLines().findAll { !it.startsWith('-----') }.join('') : ''
        buildConfigField "String", "UPDATER_FIXTURE_ORIGIN", "\"${fixtureOrigin}\""
        buildConfigField "String", "UPDATER_FIXTURE_CA", "\"${fixtureCa}\""
        // Test only: make the install session ask for confirmation, to exercise the confirmation path on API 31+.
        buildConfigField "boolean", "UPDATER_TEST_REQUIRE_USER_ACTION", "${project.hasProperty('updaterTestRequireUserAction')}"

        multiDexEnabled true
        //vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [moduleName: project.getName()]
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias keyProps['keyAlias']
            keyPassword keyProps['keyPassword']
            storeFile keyProps['storeFile'] ? file(keyProps['storeFile']) : null
            storePassword keyProps['storePassword']
        }

    }

    buildTypes {
        release {
            // Debug Mode Switches
            debuggable false
            jniDebuggable false
            // Remove unused resources
            shrinkResources true
            // Code obfuscation toggle
            minifyEnabled true
            // Obfuscation configuration
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Release signing requires a locally supplied keystore.
            if (keyPropsFile.exists()) signingConfig signingConfigs.release

            // Block R8 stack map warning
            buildConfigField "boolean", "DISABLE_R8_WARNINGS", "true"
        }
        debug {
            // Debug Mode Switches
            debuggable true
            jniDebuggable true
            // Debug Skip resource shrinking and code obfuscation to avoid unnecessary resource rebuilds
            shrinkResources false
            minifyEnabled false
            // Obfuscation configuration
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Keep debug builds independent of any production signing key.
            signingConfig signingConfigs.debug

            // Block R8 stack map warning
            buildConfigField "boolean", "DISABLE_R8_WARNINGS", "true"
        }
    }

    //ABIConfigure - PressCPUPackage each architecture separately
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
    def abiCodes = ['universal': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'x86': 4, 'x86_64': 5]
    packagingOptions {
        //RemoveFrpcLibofso，Download and load dynamically when needed
        // Always exclude disabled FRPC native payloads.
            exclude 'lib/armeabi-v7a/libgojni.so'
            exclude 'lib/arm64-v8a/libgojni.so'
            exclude 'lib/x86/libgojni.so'
            exclude 'lib/x86_64/libgojni.so'
        jniLibs {
            excludes += ["kotlin/**"]
        }
        resources {
            // Android resConfigs does not filter Java ResourceBundle translations.
            excludes += ['CronParserI18N_zh*.properties', '**/messages_zh*.properties', '**/messages_ja.properties']
            merge 'META-INF/mailcap'
            pickFirst 'META-INF/LICENSE.md'
            pickFirst 'META-INF/NOTICE.md'
            excludes += ['META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1']
            excludes += ["META-INF/*.kotlin_module", "META-INF/*.version", "kotlin/**", "DebugProbesKt.bin"]
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            //noinspection GrDeprecatedAPIUsage
            def abiName = output.getFilter(com.android.build.OutputFile.ABI)
            if (abiName == null) abiName = "universal"
            output.versionCodeOverride = abiCodes.get(abiName, 0) * 100000 + variant.versionCode
            output.outputFileName = "SmsF_${versionName}_${output.versionCode}_${abiName}_${variant.name}.apk"

            // Modify output-metadata.json Add date of compilation, time of compilation, time of compilationGit Commit ID
            def assembleTaskName = "assemble${variant.name.capitalize()}"
            tasks.named(assembleTaskName) {
                doLast {
                    def metadataFile = file("${output.outputFile.parent}/output-metadata.json")
                    def metadata = new JsonSlurper().parseText(metadataFile.text)
                    metadata.buildDate = buildDate
                    metadata.buildTime = buildTime
                    metadata.gitCommitId = gitCommitId
                    metadataFile.text = new JsonBuilder(metadata).toPrettyString()
                }
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    lint {
        abortOnError false
    }
    namespace 'cn.ppps.forwarder'

    /**
     * ⚠️ Windows + XAOP under; avoid debug/test Trigger clean
     */
    if (isNeedClean.toBoolean() && enableXaop) {
        preBuild.dependsOn clean
    }
}

/**
 * ================================
 * XAOP Fallback: non- release Disable All XAOP / AspectJ Task
 * ================================
 */
afterEvaluate {
    android.applicationVariants.configureEach { variant ->
        if (variant.buildType.name != "release") {
            tasks.matching {
                it.name.toLowerCase().contains("xaop") || it.name.toLowerCase().contains("aspectj")
            }.configureEach {
                enabled = false
                println "[XAOP] disable task: ${name}"
            }
        }
    }
}

/**
 * Unit Test Force Closed XAOP
 */
tasks.withType(Test).configureEach {
    systemProperty "xaop.enable", "false"
}

