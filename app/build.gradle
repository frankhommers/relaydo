// Fail before packaging if sources or regenerated AARs have drifted.
if (!rootProject.hasProperty('englishDependencyBootstrap')) {
    def verifyEnglishDependencies = tasks.register('verifyEnglishDependencies', Exec) {
        workingDir rootProject.projectDir
        commandLine 'python3', 'scripts/rebuild_english_dependencies.py', '--verify-only'
    }
    tasks.named('preBuild').configure { dependsOn verifyEnglishDependencies }
} else {
    tasks.matching { it.name.startsWith('package') || it.name.startsWith('assemble') }.configureEach {
        doFirst { throw new GradleException('Bootstrap is only for rebuilding dependencies, never packaging an APK') }
    }
}

//AutoAddX-LibraryDependency
apply from: 'x-library.gradle'
//walleMulti-channel packing.
//apply from: 'multiple-channel.gradle'

//Access commit ID
def getGitCommitId() {
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        return proc.exitValue() == 0
                ? proc.text.trim()
                : "unknown"
    } catch (Throwable ignore) {
        return "unknown"
    }
}
